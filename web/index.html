<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>PicMedic Web</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>PicMedic</h1>
      <p class="app__tagline">사진이 이상해요. 제 사진에 대해 알려주세요.</p>
      <p class="app__description">형식·손상·해상도까지 한 번에 진단해드려요.</p>
    </header>

    <section id="picker" class="picker">
      <button id="pick-btn" class="button button--primary">사진 선택</button>
      <p class="picker__hint">카메라 사진부터 캡처본까지, 사진이라면 뭐든요.</p>
    </section>

    <p class="privacy-note">
      <svg class="privacy-note__icon" viewBox="0 0 16 16" aria-hidden="true">
        <circle class="privacy-note__icon-bg" cx="8" cy="8" r="8" />
        <path class="privacy-note__icon-check" d="M4.5 8.3l2.3 2.3L11.5 5.8" />
      </svg>
      <span>사진은 인터넷이나 서버로 전송되지 않고, 이 기기 안에서만 분석됩니다.</span>
    </p>

    <section id="loading" class="loading hidden">
      <p>진단 중...</p>
    </section>

    <section id="result" class="result hidden">
      <div class="result__badge" id="result-badge"></div>
      <span id="result-screenshot-tag" class="result__tag hidden">캡처본으로 추정</span>
      <h2 id="result-filename" class="result__filename"></h2>
      <p id="result-message" class="result__message"></p>

      <dl class="result__details" id="result-details"></dl>

      <button id="retry-btn" class="button button--secondary">다른 사진 진단하기</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
