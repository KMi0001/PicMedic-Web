<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>PicMedic Web</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>PicMedic</h1>
      <p class="app__tagline">안 열리거나, 흐릿하거나, 이상하게 찍힌 사진<br />이유를 알려드려요.</p>
      <p class="app__description">형식·손상·해상도까지 한 번에 진단해드려요.</p>
    </header>

    <section id="picker" class="picker">
      <button id="pick-btn" class="button button--primary">사진 선택</button>
      <p class="picker__hint">카메라 사진부터 캡처본까지, 사진이라면 뭐든요.</p>
    </section>

    <p class="privacy-note">
      <svg class="privacy-note__icon" viewBox="0 0 16 16" aria-hidden="true">
        <circle class="privacy-note__icon-bg" cx="8" cy="8" r="8" />
        <path class="privacy-note__icon-check" d="M4.5 8.3l2.3 2.3L11.5 5.8" />
      </svg>
      <span>사진은 인터넷이나 서버로 전송되지 않고, 이 기기 안에서만 분석됩니다.</span>
    </p>

    <section id="loading" class="loading hidden">
      <p>진단 중...</p>
    </section>

    <section id="result" class="result hidden">
      <div class="result__preview-wrap hidden" id="result-preview-wrap">
        <img class="result__preview" id="result-preview" alt="선택한 사진 미리보기" />
      </div>

      <div class="result__badge" id="result-badge"></div>
      <span id="result-screenshot-tag" class="result__tag hidden">스크린샷</span>
      <h2 id="result-filename" class="result__filename"></h2>
      <p id="result-message" class="result__message"></p>

      <dl class="result__details" id="result-details"></dl>

      <div class="print-suitability hidden" id="print-suitability">
        <h3 class="print-suitability__title">인화 적합성</h3>
        <div class="print-suitability__grid" id="print-suitability-grid"></div>
        <p class="print-suitability__note hidden" id="print-suitability-note">
          화질 이슈가 있어 인화하면 더 도드라져 보일 수 있어요.
        </p>
      </div>

      <button id="retry-btn" class="button button--secondary">다른 사진 진단하기</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
